name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build and test
        run: mvn -B clean verify --file pom.xml
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"

  deploy:
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: nexus-release
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Prepare Maven settings
        run: |
          mkdir -p ${{ github.workspace }}/.m2
          cp .ci/maven-settings-template.xml ${{ github.workspace }}/.m2/settings.xml
          sed -i 's#NEXUS_USER_PLACEHOLDER#${{ secrets.NEXUS_USERNAME }}#g' ${{ github.workspace }}/.m2/settings.xml
          sed -i 's#NEXUS_PASS_PLACEHOLDER#${{ secrets.NEXUS_PASSWORD }}#g' ${{ github.workspace }}/.m2/settings.xml

      - name: Deploy with Maven
        run: mvn -B deploy --file pom.xml --settings ${{ github.workspace }}/.m2/settings.xml -DskipTests
        env:
          MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
