# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v5
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Prepare Maven settings
      run: |
        mkdir -p ${{ github.workspace }}/.m2
        cp .ci/maven-settings-template.xml ${{ github.workspace }}/.m2/settings.xml
        sed -i 's#NEXUS_USER_PLACEHOLDER#${{ secrets.NEXUS_USERNAME }}#g' ${{ github.workspace }}/.m2/settings.xml
        sed -i 's#NEXUS_PASS_PLACEHOLDER#${{ secrets.NEXUS_PASSWORD }}#g' ${{ github.workspace }}/.m2/settings.xml
        echo "Settings file created at ${{ github.workspace }}/.m2/settings.xml"

    - name: Build and Deploy with Maven
      run: mvn -B clean deploy --file pom.xml --settings ${{ github.workspace }}/.m2/settings.xml
      env:
        MAVEN_OPTS: "-Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
